<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spotify clone</title>
    <link rel="icon" href="img/DVD.png" type="image/png" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <h1>Spotify clone</h1>
    <!--INICIO CARD-->
    <div class="card">
      <h4 id="playlist-title">Titulo da playlist</h4>
      <img id="cover" src="img/capa.webp" alt="Capa da musica" />
      <audio
        id="audio"
        src="songs/Shakira, Burna Boy - Dai Dai (Official Video) - shakiraVEVO (youtube).mp3"
      ></audio>
      <div id="below-cover">
        <div id="song-info">
          <div id="song-name">Nome da musica</div>
          <div class="light-color" id="band-name">Nome da banda</div>
        </div>
        <div class="button light-color" id="like">
          <i class="bi bi-heart"></i>
        </div>
      </div>
      <div id="progress-bar">
        <div id="current-progress"></div>
      </div>
      <div id="button-container">
        <button class="button" id="shuffle">
          <i class="bi bi-shuffle"></i>
        </button>
        <button class="button button-navigate" id="previous">
          <i class="bi bi-skip-backward-circle"></i>
        </button>
        <button class="button button-navigate button-biggest" id="play">
          <i class="bi bi-play-circle"></i>
        </button>
        <button class="button button-navigate" id="next">
          <i class="bi bi-skip-forward-circle"></i>
        </button>
        <button class="button" id="repeat">
          <i class="bi bi-repeat"></i>
        </button>
      </div>
      <!--FIM DO CARD-->
    </div>
    <script src="js/script.js"></script>
  </body>
</html>
